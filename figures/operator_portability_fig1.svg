<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="white"/>
<text x="60" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="start">Figure 1 | Evidence architecture: replication versus operator substitution</text>
<text x="60" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Historical reference ensemble (seeds 20290410–20290414)</text>
<rect x="70" y="125" width="360" height="90" rx="10" fill="#f2f2f2" stroke="#333"/>
<text x="250" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">No connectivity</text>
<text x="250" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">shared historical observations</text>
<rect x="470" y="125" width="360" height="90" rx="10" fill="#f2f2f2" stroke="#333"/>
<text x="650" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Allele-only m=.10</text>
<text x="650" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">shared historical observations</text>
<text x="900" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">One fresh replication</text>
<rect x="885" y="125" width="250" height="90" rx="10" fill="#eef6ff" stroke="#333"/>
<text x="1010" y="158" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Phase U</text>
<text x="1010" y="186" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">new seeds, same operator</text>
<line x1="830" y1="170" x2="885" y2="170" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="60" y="285" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Two process substitutions against the same historical reference</text>
<line x1="250" y1="215" x2="250" y2="340" stroke="#555" stroke-width="2"/>
<line x1="650" y1="215" x2="650" y2="340" stroke="#555" stroke-width="2"/>
<line x1="250" y1="340" x2="650" y2="340" stroke="#555" stroke-width="2"/>
<line x1="450" y1="340" x2="450" y2="380" stroke="#555" stroke-width="2"/>
<rect x="130" y="390" width="390" height="95" rx="10" fill="#f7f7ff" stroke="#333"/>
<text x="325" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Phase R: whole-individual d=.10</text>
<text x="325" y="454" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">process arm only; historical refs reused</text>
<rect x="590" y="390" width="390" height="95" rx="10" fill="#fff7f1" stroke="#333"/>
<text x="785" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Phase S: pollen-only g=.20</text>
<text x="785" y="454" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">process arm only; historical refs reused</text>
<line x1="450" y1="380" x2="325" y2="390" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<line x1="450" y1="380" x2="785" y2="390" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<rect x="120" y="530" width="900" height="70" rx="12" fill="#fafafa" stroke="#222" stroke-width="2"/>
<text x="570" y="563" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Evidence count: 1 independent fresh replication + 2 shared-reference operator substitutions</text>
<text x="570" y="588" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">R and S are not independent baseline replications</text>
</svg>
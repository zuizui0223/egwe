[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "egwe"
version = "0.1.0"
description = "Recurrent-transition tests of high-function-state feasibility, functional-loss regimes, and genetic-warning evaluability"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
reproducibility = ["build>=1.2"]

[project.scripts]
protocol002 = "eco_genetic_warning_extensions.protocol002_cli:main"

[project.urls]
Repository = "https://github.com/zuizui0223/egwe"
"Mechanistic parent" = "https://github.com/zuizui0223/eco-genetic-criticality"
"Publication manuscripts" = "https://github.com/zuizui0223/egwe/tree/main/manuscript"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

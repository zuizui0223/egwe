name: Close status and portability orphan

on:
  push:
    branches: [agent/close-status-and-portability-orphan]
    paths:
      - 'scripts/tmp_close_status_and_portability.py'
      - '.github/workflows/close-status-and-portability-orphan.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/close-status-and-portability-orphan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded reconciliation
        run: python scripts/tmp_close_status_and_portability.py
      - name: Normalize non-semantic portability checks and overlap wording
        run: |
          python -c "from pathlib import Path; p=Path('scripts/validate_publication_lanes.py'); t=p.read_text(); t=t.replace('\"p=.811\",', '\".811\",').replace('\"p=.728\",', '\".728\",'); p.write_text(t)"
          python -c "from pathlib import Path; p=Path('manuscript/operator_portability.md'); t=p.read_text(); old='This development lane is deliberately **not** a compressed version of the flagship. It does not use the `0.2543` aligned/anti-aligned counterexample, the `+5.33/+5.20` propagation contrasts, the 35/48/33/49 warning denominators, q-dependent sorting DID, recruitment buffering, direct recoupling, density-gate result, exact route-margin sign audit, or last-refuge AUC.'; new='This development lane is deliberately **not** a compressed version of the flagship. It excludes the state-alignment, horizon-propagation, warning-denominator, operator-balance and last-refuge evidence owned by the active flagship; the binding exclusion set is the flagship evidence registry in `publication_lanes.json`.'; assert t.count(old)==1; p.write_text(t.replace(old,new,1))"
      - name: Validate governance and full regression suite
        run: |
          python -m pip install -q --upgrade pip pytest
          python -m pip install -q -e .
          python scripts/validate_publication_lanes.py
          python scripts/check_nee_flagship_compliance.py
          python -m pytest
      - name: Commit reconciled publication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manuscript/ scripts/validate_publication_lanes.py tests/test_publication_governance.py
          git diff --cached --quiet && exit 0
          git commit -m "Close stale status contradictions and route portability"
          git push origin HEAD:agent/close-status-and-portability-orphan

name: Finalize NEE operator wording

on:
  push:
    branches: [agent/nee-last-refuge-warning-integration]
    paths:
      - '.github/workflows/nee-operator-wording-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nee-last-refuge-warning-integration
          fetch-depth: 0
      - name: Replace only ambiguous umbrella repair wording
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          targets = {
            Path('manuscript/nee_flagship_article.md'): {
              'which life-cycle operator causes it, which operator repairs it, and which feedback opens the path to collapse?': 'which life-cycle operator propagates it, which processes buffer or recouple it, and which feedback opens the path to collapse?',
              'The resulting ecology is a competition between sorting and repair.': 'The resulting ecology is a balance among sorting, buffering and recoupling.',
              'Interaction feedback can repair a weak ecological context when the local trait/genetic bundle exceeds the current interaction state.': 'Interaction feedback can recouple a weak ecological context toward the local trait/genetic bundle when that bundle exceeds the current interaction state.',
              'These systems motivate measurements of sorting, repair and memory; they do not replicate the simulator.': 'These systems motivate measurements of sorting, buffering, recoupling and memory; they do not replicate the simulator.',
              'A prospective comparison should instead ask which operator is active and whether measured repair keeps pace with local sorting and demographic headroom loss.': 'A prospective comparison should instead ask which operator is active and whether buffering and recoupling keep pace with local sorting and demographic headroom loss.',
              'which processes are sorting functional compatibility, which processes are repairing mismatch, and whether demographic feedback has consumed the headroom for repair': 'which processes are sorting functional compatibility, which processes buffer trait–allele mismatch or recouple ecological and eco-genetic state, and whether demographic feedback has consumed the remaining functional headroom',
            },
            Path('manuscript/nee_flagship_cover_letter.md'): {
              'These examples define empirical questions for future synchronized tests of sorting, repair and memory.': 'These examples define empirical questions for future synchronized tests of sorting, buffering, recoupling and memory.',
            },
          }
          for path, replacements in targets.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  assert text.count(old) == 1, f'{path}: expected one occurrence: {old}'
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          article = Path('manuscript/nee_flagship_article.md').read_text(encoding='utf-8')
          assert '\\frac{\\operatorname{logit}(0.625)}{4.5}\\right)' in article
          assert 'AUC **0.92734**' in article
          print('operator wording finalization: PASS')
          '@ | Set-Content finalize.py -Encoding UTF8
          python finalize.py
          Remove-Item finalize.py
      - name: Commit bounded manuscript-only change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/nee_flagship_article.md manuscript/nee_flagship_cover_letter.md
          $files = git diff --cached --name-only
          foreach ($f in $files) {
            if ($f -ne 'manuscript/nee_flagship_article.md' -and $f -ne 'manuscript/nee_flagship_cover_letter.md') { throw "unexpected file $f" }
          }
          git commit -m "Separate buffering and recoupling throughout NEE narrative"
          git push origin "HEAD:agent/nee-last-refuge-warning-integration"

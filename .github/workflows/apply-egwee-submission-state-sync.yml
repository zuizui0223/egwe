name: Apply EGWEE submission-state governance sync

on:
  push:
    branches:
      - governance/egwee-submission-state-sync-2026-09-16
    paths:
      - 'scripts/_apply_egwee_submission_state_sync_2026_09_16.py'
      - '.github/workflows/apply-egwee-submission-state-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply governance synchronization
        run: python scripts/_apply_egwee_submission_state_sync_2026_09_16.py
      - name: Validate publication router
        run: python scripts/validate_publication_lanes.py
      - name: Run governance tests
        run: python -m pytest -q tests/test_publication_governance.py
      - name: Commit synchronized governance files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/_apply_egwee_submission_state_sync_2026_09_16.py
          git add README.md manuscript/README.md manuscript/publication_lanes.json manuscript/PUBLICATION_LANES.md manuscript/EG_SERIES_SUBMISSION_STATUS_2026-09-08.md manuscript/EG_SERIES_SUBMISSION_STATUS_2026-09-16.md manuscript/nee_flagship_submission_metadata.md manuscript/main_story_revision.md scripts/validate_publication_lanes.py tests/test_publication_governance.py
          git commit -m 'Synchronize EGWEE submission routing state'
          git push origin HEAD:governance/egwee-submission-state-sync-2026-09-16

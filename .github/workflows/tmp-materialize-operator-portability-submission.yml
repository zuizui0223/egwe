name: Materialize operator-portability submission package

on:
  push:
    branches: [agent/operator-portability-submission-package]
    paths:
      - 'scripts/tmp_materialize_operator_portability_submission.py'
      - '.github/workflows/tmp-materialize-operator-portability-submission.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-portability-submission-package
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and build figures
        run: |
          python -m pip install -q --upgrade pip pytest
          python -m pip install -q -e .
          python scripts/build_operator_portability_figures.py
      - name: Validate submission surface and bundle
        run: |
          python scripts/check_operator_portability_submission.py
          python -m pytest -q tests/test_operator_portability_development.py tests/test_operator_portability_submission.py
          python scripts/build_operator_portability_submission_bundle.py --repo-root . --output /tmp/operator_portability_submission
      - name: Synchronize package-ready routing
        run: python scripts/tmp_materialize_operator_portability_submission.py
      - name: Revalidate after routing sync
        run: |
          python scripts/validate_publication_lanes.py
          python scripts/check_operator_portability_submission.py
          python -m pytest -q tests/test_operator_portability_development.py tests/test_operator_portability_submission.py
      - name: Commit materialized package state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manuscript/ figures/ scripts/validate_publication_lanes.py
          git diff --cached --quiet && exit 0
          git commit -m "Materialize operator-portability Short Communication package"
          git push origin HEAD:agent/operator-portability-submission-package

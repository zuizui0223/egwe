name: Relational natural source schema gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/empirical/relational_source_scout_20261008.json'
      - 'artifacts/empirical/expt2_forward_source_eligibility_20261008.json'
      - 'docs/EXPT2_PUBLIC_FORWARD_DATA_GATE_2026-10-08.md'
      - 'scripts/check_expt2_public_forward_gate.py'
      - 'tests/test_expt2_public_forward_gate.py'
      - 'docs/RELATIONAL_TRANSFER_*.md'
      - 'docs/RELATIONAL_STATE_NATURAL_TRANSFER_PROTOCOL_2026-10-08.md'
      - 'scripts/validate_relational_source_scout.py'
      - 'scripts/probe_brassica_dryad_schema.py'
      - 'scripts/diagnose_brassica_dryad_transport.py'
      - 'tests/test_relational_source_scout.py'
      - 'tests/test_brassica_dryad_header_probe.py'
      - '.github/workflows/relational-natural-source-schema-gate.yml'
  workflow_dispatch:
    inputs:
      retry_brassica_public_zip:
        description: 'Manual, explicitly authorised recheck after 401/403 access stop'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  header-only-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify machine-readable source admission rules
        run: python scripts/validate_relational_source_scout.py
      - name: Validate exPt2 public source versus actual longitudinal same-donor panel
        run: python scripts/check_expt2_public_forward_gate.py
      - name: Test fail-closed gates and nested ZIP header-only reader
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_relational_source_scout.py tests/test_brassica_dryad_header_probe.py tests/test_expt2_public_forward_gate.py
      - name: Diagnose official Dryad metadata and download routes without outcomes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_brassica_public_zip }}
        run: python scripts/diagnose_brassica_dryad_transport.py
      - name: Query published Dryad ZIP without opening biological outcome values
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_brassica_public_zip }}
        run: |
          python scripts/probe_brassica_dryad_schema.py \
            --output source_schema_brassica.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("source_schema_brassica.json").read_text())
          assert r["outcome_values_opened"] is False
          if r["status"] == "ACCESS_OR_SCHEMA_STOP":
              print("::warning::SOURCE_ACCESS_STOP; not an ecological null or data verification.")
          elif r["status"] != "RAW_HEADER_INDEX_OBTAINED":
              raise AssertionError(f"unknown schema decision {r['status']}")
          else:
              print("Archive header acquisition done; no prospective join or outcome model validated")
          PY
      - name: Upload schema-only source receipt
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_brassica_public_zip }}
        uses: actions/upload-artifact@v4
        with:
          name: brassica-header-only-source-gate
          path: source_schema_brassica.json
          if-no-files-found: error

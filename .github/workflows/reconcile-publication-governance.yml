name: Reconcile publication governance

on:
  push:
    branches: [agent/reconcile-publication-governance]
    paths:
      - 'scripts/tmp_reconcile_publication_governance.py'
      - '.github/workflows/reconcile-publication-governance.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reconcile-publication-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded governance patches
        run: |
          python scripts/tmp_reconcile_publication_governance.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_publication_lanes.py')
          text=p.read_text(encoding='utf-8')
          old='    assert "no overlapping standalone manuscript will be simultaneously submitted" in flagship_cover\n'
          new='    assert "substantially overlapping standalone manuscript" in flagship_cover\n    assert "simultaneously submitted" in flagship_cover\n    assert "flagship is under consideration" in flagship_cover\n'
          if text.count(old) != 1:
              raise SystemExit('flagship-cover assertion anchor drifted')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate publication governance
        run: |
          python -m py_compile scripts/validate_publication_lanes.py
          python scripts/validate_publication_lanes.py
      - name: Commit reconciled governance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_READINESS.md docs/PROJECT_BOUNDARY.md docs/LAST_REFUGE_WARNING_HOLDOUT_RESULTS_2026-09-07.md manuscript/ scripts/validate_publication_lanes.py
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile publication governance with active NEE flagship"
          git push origin HEAD:agent/reconcile-publication-governance

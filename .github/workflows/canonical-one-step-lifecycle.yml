name: Canonical downstream operator composition
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/canonical_one_step_lifecycle_composition.py'
      - 'tests/test_canonical_one_step_lifecycle_composition.py'
      - 'docs/CANONICAL_ONE_STEP_LIFECYCLE_COMPOSITION_2026-10-13.md'
      - '.github/workflows/canonical-one-step-lifecycle.yml'
permissions:
  contents: read
jobs:
  one-step-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_canonical_one_step_lifecycle_composition.py
      - run: python scripts/canonical_one_step_lifecycle_composition.py > conditional_one_step_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: conditional-one-step-lifecycle
          path: conditional_one_step_receipt.json

name: YHT official panel sensitivity audit

on:
  pull_request:
    paths:
      - '.github/workflows/yht-official-panel-sensitivity.yml'
      - 'src/eco_genetic_warning_extensions/yht_official_panel_sensitivity.py'
      - 'tests/test_yht_official_panel_sensitivity.py'
      - 'scripts/audit_yht_official_panel_sensitivity.py'
      - 'experiments/yht_official_panel_sensitivity_protocol.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-free-official-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and unit tests
        run: python -m pip install -e '.[dev]'
      - name: Verify sample metric and source-specific timestamp contracts
        run: python -m pytest -q tests/test_yht_official_panel_sensitivity.py tests/test_yht_mirror_sampling_audit.py
      - name: Download pinned official Movebank source in disposable runner
        run: |
          python scripts/run_yht_official_movebank_coverage.py \
            --workdir "${RUNNER_TEMP}/yht_official_source" \
            --output "${RUNNER_TEMP}/yht_coverage.json"
      - name: Verify official source and run outcome-free panel audit
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          coverage=json.loads((root/"yht_coverage.json").read_text())
          expected_years=[2004,2013,2014,2015,2016,2017,2018,2019]
          assert coverage["eligible_years"]==expected_years, coverage["eligible_years"]
          source=coverage["source"]
          expected_sha="1069cd7531d1d7a519cb817b09d015be91c552ecafab504869a81eb01eff4201"
          assert source["selected_event_file_sha256"]==expected_sha
          found=[]
          for path in (root/"yht_official_source").rglob("*.csv"):
              if path.name != source["selected_event_file"]:
                  continue
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              if digest==expected_sha:
                  found.append(path)
          assert len(found)==1, f"ambiguous official event CSV: {len(found)}"
          out=root/"yht_official_panel_sensitivity.json"
          subprocess.run([
              sys.executable,
              "scripts/audit_yht_official_panel_sensitivity.py",
              "--source-csv",str(found[0]),
              "--output",str(out),
          ],check=True)
          audit=json.loads(out.read_text())
          assert audit["status"]=="outcome_free_exploratory_not_a_future_demography_test"
          assert audit["overall"]["number_of_eligible_years"]==8
          assert audit["source"]["event_file_sha256"]==expected_sha
          print(json.dumps({
              "status":audit["status"],
              "overall":audit["overall"],
              "years":audit["years"],
          },indent=2))
          PY
      - name: Upload aggregates only, no GPS coordinates
        uses: actions/upload-artifact@v4
        with:
          name: yht-official-panel-sensitivity-aggregate
          path: ${{ runner.temp }}/yht_official_panel_sensitivity.json
          if-no-files-found: error

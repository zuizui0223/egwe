name: Fix governance regressions

on:
  push:
    branches: [agent/reconcile-publication-governance]
    paths:
      - 'scripts/tmp_fix_governance_regressions.py'
      - '.github/workflows/fix-governance-regressions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reconcile-publication-governance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded regression fixes
        run: python scripts/tmp_fix_governance_regressions.py
      - name: Run full regression suite
        run: |
          python -m pip install -q --upgrade pip pytest
          python -m pip install -q -e .
          python scripts/validate_publication_lanes.py
          python scripts/check_nee_flagship_compliance.py
          python -m pytest
      - name: Commit bounded regression fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manuscript/README.md tests/test_natural_data_manuscript_spine.py
          git diff --cached --quiet && exit 0
          git commit -m "Preserve science spine while updating publication routing"
          git push origin HEAD:agent/reconcile-publication-governance

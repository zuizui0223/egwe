name: Lazaro natural Q2 schema gate

on:
  pull_request:
    paths:
      - "manuscript/NEE_Q2_NATURAL_PROSPECTIVE_VALIDATION_PREREGISTRATION.md"
      - "scripts/fetch_lazaro_natural_q2_schema.py"
      - ".github/workflows/lazaro-natural-q2-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install header-only workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Run response-blind schema discovery
        run: python scripts/fetch_lazaro_natural_q2_schema.py --manifest artifacts/empirical/lazaro_natural_q2_schema.json
      - name: Show schema-only decision
        run: cat artifacts/empirical/lazaro_natural_q2_schema.json
      - name: Upload schema manifest
        uses: actions/upload-artifact@v4
        with:
          name: lazaro-natural-q2-schema
          path: artifacts/empirical/lazaro_natural_q2_schema.json
          if-no-files-found: error

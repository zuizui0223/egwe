name: Sync EGWEE meta-analysis route

on:
  push:
    branches: [agent/route-egwee-as-empirical-meta-analysis]
    paths:
      - 'scripts/tmp_sync_egwee_meta_route.py'
      - '.github/workflows/tmp-sync-egwee-meta-route.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/route-egwee-as-empirical-meta-analysis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply EGWEE meta-analysis routing update
        run: python scripts/tmp_sync_egwee_meta_route.py
      - name: Validate publication governance and NEE source manifest
        run: |
          python scripts/validate_publication_lanes.py
          python scripts/check_nee_flagship_compliance.py
      - name: Commit synchronized route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manuscript/README.md manuscript/PUBLICATION_LANES.md manuscript/EG_SERIES_SUBMISSION_STATUS_2026-09-08.md manuscript/publication_lanes.json manuscript/nee_flagship_source_manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Route EGWEE as the empirical multilayer meta-analysis"
          git push origin HEAD:agent/route-egwee-as-empirical-meta-analysis

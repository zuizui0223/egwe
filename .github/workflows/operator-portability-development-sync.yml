name: Operator portability development sync

on:
  push:
    branches: [agent/operator-portability-precision-note]
    paths:
      - 'scripts/tmp_sync_operator_portability_development.py'
      - '.github/workflows/operator-portability-development-sync.yml'

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-portability-precision-note
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded development sync
        run: python scripts/tmp_sync_operator_portability_development.py
      - name: Validate precision derivation and repository contracts
        run: |
          python -m pip install -q --upgrade pip pytest
          python -m pip install -q -e .
          python scripts/operator_portability_precision.py > /tmp/operator_portability_precision.json
          python scripts/validate_publication_lanes.py
          python scripts/check_nee_flagship_compliance.py
          python -m pytest
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('manuscript/operator_portability.md').read_text(encoding='utf-8')
          words = re.findall(r"\b[\w'-]+\b", text)
          print(f'operator_portability words: {len(words)}')
          assert 1300 <= len(words) <= 3000
          PY
      - name: Commit synchronized development state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manuscript/publication_lanes.json manuscript/PUBLICATION_LANES.md manuscript/EG_SERIES_SUBMISSION_STATUS_2026-09-08.md scripts/validate_publication_lanes.py
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize portability evidence structure and precision boundary"
          git push origin HEAD:agent/operator-portability-precision-note

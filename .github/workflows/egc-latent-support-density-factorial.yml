name: EGC latent-support density factorial

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/egc_latent_support_density_factorial.py'
      - 'tests/test_egc_latent_support_density_factorial.py'
      - 'docs/EGC_LATENT_SUPPORT_DENSITY_FACTORIAL_2026-10-28.md'
      - 'artifacts/egc_latent_support_density/8cell_256seed_20261028_summary.json'
      - '.github/workflows/egc-latent-support-density-factorial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: egwe
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/egc
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: egc
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require frozen source commit
        run: |
          test "$(git -C egc rev-parse HEAD)" = "dd8ee379d0d3518194c767d16402042525bc00dc"
      - name: Verify algebraic crossing, exact source and grouped uncertainty tests
        env:
          EGC_PINNED_ROOT: ${{ github.workspace }}/egc
        run: |
          cd egwe
          python -m pip install pytest
          python -m pytest -q tests/test_egc_latent_support_density_factorial.py
      - name: Run eight-cell 12-generation stochastic source-pinned factorial
        env:
          EGC_PINNED_ROOT: ${{ github.workspace }}/egc
        run: |
          cd egwe
          python scripts/egc_latent_support_density_factorial.py --seed-start 70001 --seed-count 256 --output density_factorial_256seed_unrounded.json
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path("density_factorial_256seed_unrounded.json").read_text())
          assert r["source_commit"]=="dd8ee379d0d3518194c767d16402042525bc00dc"
          assert r["seed_block"]==list(range(70001,70257))
          assert r["generations"]==12
          assert len(r["scenarios"])==8
          assert sum(v["summary"]["initial_one_step_q_threshold_met"] for v in r["scenarios"].values())==1
          assert r["scenarios"]["q0.98_p0.40_N40"]["summary"]["initial_one_step_q_threshold_met"]
          assert r["no_natural_field_validation"] is True
          assert r["N0_change_combines_density_population_and_finite_drift"] is True
          assert r["q_crossing_is_only_a_one_step_ecological_support_diagnostic"] is True
          assert r["frozen_NEE_numerical_results_unchanged"] is True
          for label,v in r["scenarios"].items():
              assert v["summary"]["n_seeds"]==256
              assert v["initial_high_trait_count"]==0
              assert v["summary"]["maximum_q2_high_trait_grid_viability_certified_impossible"] is True
              assert v["summary"]["grid_viable_at_generation_2_count"]==0
              assert v["summary"]["grid_viable_at_generation_12_count"]==0
              assert v["summary"]["grid_viable_any_generation_3_to_final_count"]==0
              assert v["summary"]["q2_source_derived_upper_bound"]<.5991975107
              assert all(case["source_order_preserved"] for case in v["cases"])
          PY
      - name: Compare full source receipt with committed scientific claims
        run: |
          cd egwe
          python - <<'PY'
          from pathlib import Path
          import json
          raw=json.loads(Path("density_factorial_256seed_unrounded.json").read_text())
          saved=json.loads(Path("artifacts/egc_latent_support_density/8cell_256seed_20261028_summary.json").read_text())
          assert saved["source"]["commit"]==raw["source_commit"]
          assert saved["experiment"]["scenarios"]==len(raw["scenarios"])==8
          assert saved["experiment"]["n_per_cell"]==len(raw["seed_block"])==256
          assert saved["source_theorem_context"]["previously_proven_any_T0_zero_enters_nonviable_high_grid_at_generation_3"]
          for row in saved["cells"]:
              case=raw["scenarios"][row["id"]]
              summed=case["summary"]
              assert abs(row["q1"]-summed["q1"])<1e-12
              assert abs(row["mean_q2"]-summed["mean_q2"])<1e-12
              assert abs(row["observed_q2_max_approx"]-summed["max_observed_q2"])<1e-5
              assert row["high_trait_count_generation_1"]==summed["counts"]["expressed_at_generation_1"]
              assert row["three_consecutive_high_trait_count"]==summed["counts"]["three_consecutive_high_snapshots"]
              assert row["high_trait_count_generation_12"]==summed["counts"]["high_at_final_generation"]
              assert row["ever_joint_trait_allele_zero_count"]==summed["counts"]["ever_joint_trait_allele_zero"]
              assert row["one_step_allele_switch_met"]==summed["initial_one_step_q_threshold_met"]
              assert summed["grid_viable_at_generation_2_count"]==0
              assert summed["grid_viable_any_generation_3_to_final_count"]==0
          for record in saved["descriptive_N40_minus_N20_final_occupancy"]:
              current=raw["descriptive_density_contrasts"]["contrasts"][record["stratum"]]["outcomes"]["high_at_final_generation"]
              assert abs(record["final_occupancy_proportion_difference"]-current["N40_minus_N20"])<1e-12
              assert record["paired_seed_exploratory_95_percentile_interval"]==current["paired_seed_bootstrap_percentile_95"]
          assert saved["limitations"]["no_natural_genetic_pollination_data"]
          assert saved["limitations"]["not_a_pure_density_feedback_edge_intervention"]
          print("Verified source receipt counts, q1/q2 and descriptive uncertainty against committed ledger")
          PY
      - name: Upload source and model-only full receipt
        uses: actions/upload-artifact@v4
        with:
          name: egc-latent-support-density-eight-cells-256seeds
          path: egwe/density_factorial_256seed_unrounded.json
          if-no-files-found: error

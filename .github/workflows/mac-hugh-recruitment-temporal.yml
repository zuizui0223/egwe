name: Mac Hugh temporal recruitment audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/eco_genetic_warning_extensions/mac_hugh_recruitment_forecast.py'
      - 'tests/test_mac_hugh_recruitment_forecast.py'
      - 'scripts/run_mac_hugh_recruitment_forecast.py'
      - 'experiments/mac_hugh_recruitment_temporal_protocol.json'
      - '.github/workflows/mac-hugh-recruitment-temporal.yml'

jobs:
  rolling-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test runner
        run: |
          python -m pip install -e . pytest
      - name: Test frozen temporal-forecast and lag rules
        run: python -m pytest -q tests/test_mac_hugh_recruitment_forecast.py
      - name: Run original published source with frozen year-forward prediction contract
        run: python -m scripts.run_mac_hugh_recruitment_forecast
      - name: Upload only aggregate temporal-result artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-hugh-temporal-recruitment-audit
          path: artifacts/mac_hugh_recruitment/temporal_result.json

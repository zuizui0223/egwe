name: AA RR robustness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: egwe
      - uses: actions/checkout@v4
        with:
          repository: zuizui0223/egc
          ref: dd8ee379d0d3518194c767d16402042525bc00dc
          path: egc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cd egwe
          python -m pip install pytest
          python -m pytest -q tests/test_egc_aa_rr_paired_robustness.py
      - run: |
          cd egwe
          python scripts/egc_aa_rr_paired_robustness.py --output robustness_receipt.json
        env:
          EGC_PINNED_ROOT: ${{ github.workspace }}/egc
      - uses: actions/upload-artifact@v4
        with:
          name: paired-robustness
          path: egwe/robustness_receipt.json

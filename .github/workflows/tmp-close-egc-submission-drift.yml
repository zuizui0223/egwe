name: Close EGC submission routing drift

on:
  push:
    branches: [agent/two-question-nee-and-egwee-conclusion]
    paths:
      - 'scripts/tmp_close_egc_submission_drift.py'
      - '.github/workflows/tmp-close-egc-submission-drift.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/two-question-nee-and-egwee-conclusion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply routing cleanup
        run: python scripts/tmp_close_egc_submission_drift.py
      - name: Validate NEE and publication governance
        run: |
          python scripts/check_nee_flagship_compliance.py
          python scripts/validate_publication_lanes.py
      - name: Commit routing cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/README.md manuscript/EG_SERIES_SUBMISSION_STATUS_2026-09-08.md RELEASE_READINESS.md
          git diff --cached --quiet && exit 0
          git commit -m "Route EGC exclusively through NEE Question 1"
          git push origin HEAD:agent/two-question-nee-and-egwee-conclusion

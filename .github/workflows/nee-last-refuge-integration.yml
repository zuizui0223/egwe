name: NEE last-refuge manuscript integration

on:
  push:
    branches:
      - agent/nee-last-refuge-warning-integration
    paths:
      - scripts/apply_nee_last_refuge_integration.py
      - .github/workflows/nee-last-refuge-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/nee-last-refuge-warning-integration
          fetch-depth: 0

      - name: Apply assertion-guarded manuscript patch
        run: python scripts/apply_nee_last_refuge_integration.py

      - name: Verify bounded manuscript-only diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            manuscript/nee_flagship_article.md
            manuscript/nee_flagship_cover_letter.md
            manuscript/nee_flagship_submission_metadata.md
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            echo "unexpected integration diff" >&2
            exit 1
          fi

      - name: Commit integrated flagship text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manuscript/nee_flagship_article.md manuscript/nee_flagship_cover_letter.md manuscript/nee_flagship_submission_metadata.md
          git commit -m "Integrate confirmed last-refuge warning into NEE flagship"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: YHT public mirror movement diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/eco_genetic_warning_extensions/love_otto_spatial_metrics.py'
      - 'src/eco_genetic_warning_extensions/yht_spatial_warning_coverage.py'
      - 'src/eco_genetic_warning_extensions/yht_spatial_warning_state.py'
      - 'scripts/build_yht_spatial_warning_state.py'
      - 'tests/test_love_otto_spatial_metrics.py'
      - 'tests/test_yht_spatial_warning_coverage.py'
      - 'tests/test_yht_spatial_warning_state.py'
      - '.github/workflows/yht-public-mirror-diagnostic.yml'

jobs:
  mirror-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EGWE
        uses: actions/checkout@v4

      - name: Checkout pinned Ya Ha Tinda teaching mirror
        uses: actions/checkout@v4
        with:
          repository: EliGurarie/BrazilMove2024
          ref: 447d2882e8d14a67db429a6ef74c307dd2354866
          path: mirror
          sparse-checkout: |
            data/Elk_GPS_data.csv
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test movement pipeline
        run: |
          python -m pip install -e . pytest
          python -m pytest -q \
            tests/test_love_otto_spatial_metrics.py \
            tests/test_yht_spatial_warning_coverage.py \
            tests/test_yht_spatial_warning_state.py

      - name: Build mirror-only spatial state
        run: |
          python scripts/build_yht_spatial_warning_state.py \
            --movement-csv mirror/data/Elk_GPS_data.csv \
            --timestamp-semantics movebank_utc \
            --output mirror_spatial_state.json

      - name: Verify mirror boundary
        run: |
          python - <<'PY'
          import json
          p='mirror_spatial_state.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['status'] == 'movement_only_spatial_state_no_demographic_values_opened'
          assert d['eligible_years'] == [2004], d['eligible_years']
          y={x['year']:x for x in d['annual']}[2004]
          assert y['eligible_days'] == 43, y
          assert abs(y['cvpop'] - 0.7525712191152126) < 1e-10, y
          assert abs(y['cvind'] - 0.43216542481145925) < 1e-10, y
          assert abs(y['cvratio'] - 0.5693714205838644) < 1e-10, y
          assert abs(y['mean_pairwise_distance_m'] - 23795.768409960903) < 1e-6, y
          print(json.dumps({
              'eligible_years': d['eligible_years'],
              'year_2004': y,
              'n_daily_states': d['n_daily_states'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: yht-public-mirror-spatial-state
          path: mirror_spatial_state.json

name: NEE route-reserve final submission sync

on:
  push:
    branches: [agent/nee-route-reserve-causal-bridge]
    paths:
      - '.github/workflows/nee-route-reserve-final-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nee-route-reserve-causal-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded final submission sync
        run: python scripts/tmp_route_reserve_final_sync.py
      - name: Static validation
        run: |
          python -m py_compile scripts/build_nee_sorting_buffering_figures.py scripts/build_nee_four_operator_figure3.py scripts/check_nee_flagship_compliance.py
          python scripts/check_nee_flagship_compliance.py
      - name: Commit bounded final sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build_nee_sorting_buffering_figures.py scripts/build_nee_four_operator_figure3.py .github/workflows/nee-math-first-flagship.yml manuscript/nee_flagship_source_manifest.json manuscript/nee_flagship_cover_letter.md
          python - <<'PY'
          import subprocess
          got=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={
            'scripts/build_nee_sorting_buffering_figures.py',
            'scripts/build_nee_four_operator_figure3.py',
            '.github/workflows/nee-math-first-flagship.yml',
            'manuscript/nee_flagship_source_manifest.json',
            'manuscript/nee_flagship_cover_letter.md',
          }
          if got != expected:
              raise SystemExit(f'unexpected files: {sorted(got)}')
          PY
          git commit -m "Synchronize route-reserve figures and flagship provenance"
          git push origin "HEAD:agent/nee-route-reserve-causal-bridge"

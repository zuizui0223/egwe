name: intFlex natural Q2 confirmatory run

on:
  pull_request:
    paths:
      - 'scripts/run_intflex_strongest_refuge_extract.R'
      - 'scripts/run_intflex_strongest_refuge_confirmatory.py'
      - 'manuscript/NEE_Q2_NATURAL_STRONGEST_REFUGE_STAGE_B_CONTRACT.md'
      - '.github/workflows/intflex-natural-q2-confirmatory.yml'
  workflow_dispatch:

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fixed analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=2.0,<3' 'pandas>=2.2,<3' 'scikit-learn>=1.5,<2'

      - name: Fetch and verify locked source objects
        run: |
          mkdir -p locked_source outcome_opened
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/Magaiarsa/intFlex/41d18084cb8dfbb92cde416cddbd020c567d01a2/data/networks/all_networks_years.Rdata' \
            -o locked_source/all_networks_years.Rdata
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/Magaiarsa/intFlex/41d18084cb8dfbb92cde416cddbd020c567d01a2/data/samples.csv' \
            -o locked_source/samples.csv
          test "$(git hash-object locked_source/all_networks_years.Rdata)" = '3d0ce00843579fc5edec80ebaadac7142b5b4a4b'
          test "$(git hash-object locked_source/samples.csv)" = 'e9b060758ce3675921b83f1f64a31972c65e3504'

      - name: Open locked matrix cells and export fixed binary edge representation
        run: |
          Rscript scripts/run_intflex_strongest_refuge_extract.R \
            locked_source/all_networks_years.Rdata \
            locked_source/samples.csv \
            outcome_opened

      - name: Run one-shot confirmatory M0 versus M1 test
        run: |
          python scripts/run_intflex_strongest_refuge_confirmatory.py \
            --edges outcome_opened/positive_edges.csv \
            --meta outcome_opened/network_metadata.csv \
            --outdir outcome_opened/result

      - name: Show locked decision
        run: |
          cat outcome_opened/result/confirmatory_result.json

      - name: Upload immutable confirmatory receipt
        uses: actions/upload-artifact@v4
        with:
          name: intflex-natural-q2-confirmatory
          path: |
            outcome_opened/extraction_receipt.json
            outcome_opened/result/confirmatory_result.json
            outcome_opened/result/per_species_scores.csv
            outcome_opened/result/scored_rows.csv
            outcome_opened/result/prediction_rows.csv
          if-no-files-found: error

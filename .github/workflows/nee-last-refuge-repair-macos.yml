name: NEE last-refuge repair fallback macOS

on:
  push:
    branches: [agent/nee-last-refuge-warning-integration]
    paths:
      - '.github/workflows/nee-last-refuge-repair-macos.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/nee-last-refuge-warning-integration
          fetch-depth: 0
      - name: Apply bounded repair
        run: |
          python3 scripts/fix_nee_last_refuge_latex_escape.py
          python3 - <<'PY'
          from pathlib import Path
          a=Path('manuscript/nee_flagship_article.md').read_text()
          c=Path('manuscript/nee_flagship_cover_letter.md').read_text()
          assert '\\frac{\\operatorname{logit}(0.625)}{4.5}\\right)' in a
          assert 'The resulting ecology is a balance among sorting, buffering and recoupling.' in a
          assert 'whether buffering and recoupling keep pace with local sorting' in a
          assert 'which processes buffer trait–allele mismatch or recouple ecological and eco-genetic state' in a
          assert 'Direct eco-genetic feedback supplies a distinct recoupling route.' in c
          print('macOS bounded repair verification: PASS')
          PY
      - name: Commit repair if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/nee_flagship_article.md manuscript/nee_flagship_cover_letter.md
          if git diff --cached --quiet; then echo 'repair already applied'; exit 0; fi
          for f in $(git diff --cached --name-only); do
            case "$f" in
              manuscript/nee_flagship_article.md|manuscript/nee_flagship_cover_letter.md) ;;
              *) echo "unexpected changed file: $f"; exit 1;;
            esac
          done
          git commit -m 'Separate NEE buffering and recoupling language'
          git push origin HEAD:agent/nee-last-refuge-warning-integration

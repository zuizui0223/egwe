name: Canonical fate observable gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/canonical_fate_observable_gate.py'
      - 'tests/test_canonical_fate_observable_gate.py'
      - 'docs/CANONICAL_FATE_OBSERVABLE_GATE_2026-10-11.md'
      - '.github/workflows/canonical-fate-observable.yml'
permissions:
  contents: read
jobs:
  canonical-update-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_canonical_fate_observable_gate.py
      - run: |
          python scripts/canonical_fate_observable_gate.py > canonical_gate_receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('canonical_gate_receipt.json').read_text())
          assert d['one_step_threshold_count_difference']==2
          assert d['states']['aligned']['patches_above_0625']==2
          assert d['states']['reversed']['patches_above_0625']==4
          assert not d['future_hitting_probability_computed']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-one-step-threshold-coverage
          path: canonical_gate_receipt.json
